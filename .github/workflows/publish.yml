name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Explicitly locks the build engine to Node 22
          registry-url: 'https://registry.npmjs.org' # <--- Added to configure registry authentication scope

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Manual Compilation Engine
        run: |
          npx tsc
          npx copyfiles -u 2 "nodes/Aevent/*.svg" dist/nodes/Aevent/

      - name: Clean Manifest Layers
        run: |
          sed -i 's/\x00//g' package.json || true
          sed -i 's/\x00//g' dist/package.json || true

      - name: Deploy Direct to Registry
        run: |
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # <--- Changed from NPM_TOKEN to NODE_AUTH_TOKEN so setup-node automatically picks it up