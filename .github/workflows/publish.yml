name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Explicitly locks the build engine to Node 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Manual Compilation Engine
        run: |
          npx tsc
          npx copyfiles -u 2 "nodes/Aevent/*.svg" dist/nodes/Aevent/

      - name: Clean Manifest Layers
        run: |
          sed -i 's/\x00//g' package.json || true
          sed -i 's/\x00//g' dist/package.json || true

      - name: Deploy Direct to Registry
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
